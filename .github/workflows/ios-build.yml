name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install iOS build dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool
          python -m pip install --upgrade pip
          python -m pip install Cython==3.0.11 kivy-ios

      - name: Build Kivy for iPhone
        run: toolchain build python3 kivy --arch=arm64

      - name: Generate Xcode project
        run: toolchain create ZONE "$GITHUB_WORKSPACE"

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project "$GITHUB_WORKSPACE/ZONE-ios/ZONE.xcodeproj" \
            -scheme ZONE \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos/ZONE.app"
          test -d "$APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/ZONE.app"
          cd "$GITHUB_WORKSPACE/build"
          /usr/bin/zip -qr "$GITHUB_WORKSPACE/build/ZONE-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZONE-unsigned-ipa
          path: build/ZONE-unsigned.ipa
          if-no-files-found: error
